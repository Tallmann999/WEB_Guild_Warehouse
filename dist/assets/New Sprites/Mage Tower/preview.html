<!doctype html><html lang="ru"><meta charset="utf-8"><title>Башня мага — три состояния</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:24px;background:#1d1c22;color:#e9dec8;font:16px system-ui}main{max-width:1536px;margin:auto}select{font:inherit;padding:10px;background:#39343c;color:inherit}#scene{position:relative;width:100%;aspect-ratio:1536/1024;overflow:hidden;margin-top:16px}#scene img{position:absolute;display:block}#bg{inset:0;width:100%;height:100%}#counter{left:-12.5%;top:71.77734375%;width:125%;height:37.98828125%}#orb{left:46.875%;top:79.1015625%;width:7.8125%;transform:translateY(-100%)}#machine{left:12.3698%;top:79.1015625%;width:26.6927%;transform:translateY(-100%)}p{color:#c8c0b5}.hidden{display:none!important}</style>
<main><h1>Башня мага · варианты для согласования</h1><p>Отдельные фон, мраморный прилавок, шар и машина. В игре состояние башни соответствует стадии улучшения лавки.</p><select id="stage"><option value="1">1 · Заброшенная</option><option value="2">2 · Частично восстановленная</option><option value="3">3 · Оснащённая лаборатория</option></select><div id="scene"><img id="bg" alt="Каменная комната башни"><img id="counter" alt="Мраморный прилавок"><img id="machine" title="Машина пока не работает" alt="Костяная машина"><img id="orb" title="Шар пока не работает" alt="Фиолетовый шар"></div><p id="note"></p></main>
<script>const $=id=>document.getElementById(id);function update(){const s=Number($('stage').value);$('bg').src='backgrounds/stage-'+s+'.png';$('counter').src='counters/stage-'+s+'.png';$('orb').src='props/orb-'+(s===3?'clean':'dusty')+'.png';$('machine').src='props/machine.png';$('machine').classList.toggle('hidden',s===1);$('note').textContent=['','Паутина, заколоченные окна, грязный повреждённый мрамор и пыльный шар.','Чище, по четыре бутылки и два ящика с каждой стороны. Машина появилась слева, но пока не работает.','Стеллажи с образцами, мутагенами и препаратами. Чёрный мрамор с белыми прожилками по вашему образцу.'][s];}$('stage').onchange=update;update();</script></html>
